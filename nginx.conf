server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Resolve only when requested: missing KARI never prevents static-site startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $kari_upstream http://kari:3000;
    location ^~ /kari/ {
        proxy_pass $kari_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        client_max_body_size 16k;
    }
    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; try_files $uri =404; }
    location /images/ { expires 7d; try_files $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
