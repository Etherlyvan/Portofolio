services:
  portfolio:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        KARI_ENABLED: ${KARI_ENABLED:-false}
        KARI_WIDGET_URL: ${KARI_WIDGET_URL:-/kari/embed.js}
        KARI_API_BASE: ${KARI_API_BASE:-/kari/api}
        KARI_SITE_ID: ${KARI_SITE_ID:-portfolio}
    ports:
      - "${PORTFOLIO_PORT:-8080}:80"
    restart: unless-stopped
